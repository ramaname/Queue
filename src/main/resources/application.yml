spring:
  datasource:
    url: jdbc:mysql://localhost:3306/queue_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}          # в проде задайте переменную окружения DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false                        # включайте только при отладке SQL
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: never                 # не показываем внутренние тексты исключений

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}   # в проде задайте JWT_SECRET (base64, ≥ 256 бит)
  expiration: 86400000                     # 24 часа

queue:
  turn-timeout-minutes: 3                  # через сколько минут текущего автоматически пропускают

logging:
  level:
    org.springframework.security: INFO
